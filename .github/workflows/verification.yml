name: Verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: |
          npm ci
          npm ci --prefix plugins/animate/skills/publish
          npm ci --prefix plugins/animate/skills/publish/studio
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Ensure ffmpeg on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Ensure ffmpeg on Windows
        if: runner.os == 'Windows'
        run: choco install ffmpeg --yes --no-progress
      - name: Run behavioral tests
        run: npm test
      - name: Build and test studio
        run: npm run test:studio
      - name: Run renderer and map checks
        run: npm run test:render
